name: CI/CD Deployment Backend to Ubuntu VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # JOB 1: TEST & CHECK (Continuous Integration)
  # -------------------------------------------------------------
  test-and-check:
    name: 🧪 Check Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'fe/package-lock.json'

      - name: ⚙️ Install Frontend Dependencies & Typecheck
        run: |
          cd fe
          npm ci
          npx tsc --noEmit

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, zip

      - name: ⚙️ Validate Composer & Backend Syntax
        run: |
          cd be
          composer validate --strict --no-check-all

  # -------------------------------------------------------------
  # JOB 2: DEPLOY BACKEND TO UBUNTU VPS (Continuous Deployment)
  # -------------------------------------------------------------
  deploy-to-vps:
    name: 🚀 Deploy Backend to Ubuntu VPS
    needs: test-and-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🔑 Deploy Backend to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting Backend Deployment on Ubuntu VPS..."

            # 1. Access backend directory on VPS
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/bed-dongnaiford/be' }}"
            cd "$TARGET_DIR"

            # 2. Pull latest code from main branch
            echo "📥 Fetching latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Build & Deploy Backend
            if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ] || [ -f "../docker-compose.yaml" ]; then
              echo "🐳 Building Docker containers..."
              if [ -f "docker-compose.yaml" ] || [ -f "docker-compose.yml" ]; then
                docker compose up -d --build
                docker compose exec -T backend php artisan migrate --force
                docker compose exec -T backend php artisan config:cache
                docker compose exec -T backend php artisan route:cache
                docker compose exec -T backend php artisan view:cache
              else
                cd ..
                docker compose up -d --build backend webserver
                docker compose exec -T backend php artisan migrate --force
                docker compose exec -T backend php artisan config:cache
                docker compose exec -T backend php artisan route:cache
                docker compose exec -T backend php artisan view:cache
                cd be
              fi
            else
              echo "⚙️ Running Composer & Artisan commands on VPS..."
              composer install --no-dev --optimize-autoloader
              php artisan migrate --force
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              if [ -f "package.json" ]; then
                yarn build || npm run build || true
              fi
            fi

            # 4. Clean up unused Docker images
            echo "🧹 Pruning unused Docker images..."
            docker image prune -f || true

            echo "✅ Backend Deployment on Ubuntu VPS (/var/www/bed-dongnaiford/be) completed successfully!"
